<!DOCTYPE html>
<html>
<head>
    <title>Family Location Sharing</title>
</head>
<body>
    <h2>Live Location Sharing</h2>
    <p id="status">Click start to share your live location.</p>
    <button onclick="startTracking()">Start Sharing</button>

    <script>
        function startTracking() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(showPosition, showError, {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 5000
                });
            } else {
                document.getElementById("status").innerHTML = "Geolocation not supported.";
            }
        }

        function showPosition(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            document.getElementById("status").innerHTML =
                "Latitude: " + lat + "<br>Longitude: " + lon;

            console.log("Live:", lat, lon);

            // Here you would send to your backend server
        }

        function showError(error) {
            document.getElementById("status").innerHTML =
                "Error: " + error.message;
        }
    </script>
</body>
</html>
